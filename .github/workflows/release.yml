name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the release

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build DMG
        run: ./scripts/make_dmg.sh release

      # make_dmg.sh names the image from the version inside the bundle, so the tag and the
      # bundle have to agree or the release would ship a build labelled something else.
      - name: Check the tag matches the version in the bundle
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            build/Sash.app/Contents/Info.plist)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match bundle version $VERSION." >&2
            echo "Update CFBundleShortVersionString in scripts/Info.plist, or retag." >&2
            exit 1
          fi
          echo "DMG=build/Sash-$VERSION.dmg" >> "$GITHUB_ENV"

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          ### Install

          1. Download the **.dmg** below and open it.
          2. Drag **Sash** onto the **Applications** folder.
          3. First launch: right-click `Sash.app` → **Open** → **Open**. Sash is ad-hoc signed
             (no paid Apple Developer ID), so Gatekeeper asks once. Or run:
             `xattr -dr com.apple.quarantine /Applications/Sash.app`
          4. Grant **Accessibility** (System Settings → Privacy & Security → Accessibility) so
             Sash can move windows.

          See the [README](https://github.com/ismayc/sash#readme) for full usage.
          NOTES

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$DMG" \
            --title "Sash $GITHUB_REF_NAME" \
            --notes-file release-notes.md
